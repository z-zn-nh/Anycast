[package]
name = "anycast"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Anycast - Windows Local-first Search & Action Platform (Rust + Slint)"

[dependencies]
slint = { version = "1.18", features = ["raw-window-handle-06", "renderer-software"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
directories = "6"
walkdir = "2"
chrono = "0.4"
notify = "8"
pinyin = "0.11"
raw-window-handle = "0.6"
crossbeam-channel = "0.5"
parking_lot = "0.12"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
]

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1
